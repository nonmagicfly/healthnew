name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types, lint, unit tests
        run: npm run check
      - name: OpenSpec
        run: npm run spec:validate
      - name: Browser tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t health-app:ci .
      - name: Speech-to-text runtime loads in the image
        run: docker run --rm --entrypoint sh health-app:ci -c "ffmpeg -version > /dev/null && node -e \"require('onnxruntime-node')\""
      - name: Start and open the main pages
        run: |
          mkdir -p data && chmod 777 data
          docker run -d --name app -p 3000:3000 -v "$PWD/data:/data" -e HEALTH_SAMPLES=fixtures health-app:ci
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/profiles > /dev/null && break; sleep 1; done
          for path in / /documents /indicators /history /chat /api/profiles; do
            curl -sf -o /dev/null "http://localhost:3000$path" || { docker logs app; exit 1; }
          done
          test -f data/db.json
